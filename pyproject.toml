[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auric-local"
version = "0.1.0"
description = "Small from-scratch language models and a local coding workbench"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24"]

[project.scripts]
auric = "auric.cli:main"

[tool.setuptools.packages.find]
include = ["auric*"]
